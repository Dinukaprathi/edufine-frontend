<div class="toast-stack" *ngIf="toasts().length > 0">
  <div
    class="toast-card"
    *ngFor="let toast of toasts(); trackBy: trackById"
    [class.toast-success]="toast.type === 'success'"
    [class.toast-error]="toast.type === 'error'"
  >
    <div class="toast-badge"></div>
    <div class="toast-body">
      <p class="toast-title">{{ toast.title }}</p>
      <p class="toast-message" *ngIf="toast.message">{{ toast.message }}</p>
    </div>
    <button class="toast-close" type="button" (click)="dismiss(toast.id)">x</button>
  </div>
</div>
