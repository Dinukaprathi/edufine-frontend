<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Courses</h1>
      <p class="page-subtitle">Browse and manage all courses in the institution.</p>
    </div>
    <button class="btn-primary">+ Add Course</button>
  </div>

  <div class="table-card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Course Name</th>
          <th>Code</th>
          <th>Semesters</th>
          <th>Modules</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let course of courses">
          <td class="cell-primary">{{ course.name }}</td>
          <td>{{ course.code }}</td>
          <td>{{ course.semesters }}</td>
          <td>{{ course.modules }}</td>
          <td>
            <span class="status-badge" [class.active]="course.status === 'active'" [class.inactive]="course.status === 'inactive'">
              {{ course.status }}
            </span>
          </td>
          <td>
            <button class="action-btn">View</button>
            <button class="action-btn">Edit</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
