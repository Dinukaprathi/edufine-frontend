<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Staff</h1>
      <p class="page-subtitle">Manage staff members and their roles.</p>
    </div>
    <button class="btn-primary">+ Add Staff</button>
  </div>

  <div class="table-card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Department</th>
          <th>Email</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of staffMembers">
          <td class="cell-primary">{{ s.name }}</td>
          <td>
            <span class="role-badge">{{ s.role }}</span>
          </td>
          <td>{{ s.department }}</td>
          <td>{{ s.email }}</td>
          <td>
            <span class="status-badge" [class.active]="s.status === 'active'" [class.inactive]="s.status === 'inactive'">
              {{ s.status }}
            </span>
          </td>
          <td>
            <button class="action-btn">View</button>
            <button class="action-btn">Edit</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
